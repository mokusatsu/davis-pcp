name: Build and Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'fullstack/frontend/**'
      - 'fullstack/backend/app/**'
      - 'scripts/build_static.py'
      - 'scripts/check_licenses.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fullstack/frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Pyodide assets and wheels
        uses: actions/cache@v4
        with:
          path: .cache/pyodide_static
          key: pyodide-static-${{ hashFiles('scripts/build_static.py') }}
          restore-keys: |
            pyodide-static-

      - name: Build Rust graph-core WASM
        working-directory: fullstack/frontend/rust/graph-core
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Install frontend dependencies
        working-directory: fullstack/frontend
        run: npm ci

      - name: Run frontend regression tests (including WASM parity)
        working-directory: fullstack/frontend
        run: npm test -- --maxWorkers=1 --minWorkers=1

      - name: Build static site into dist/static
        run: python scripts/build_static.py --out-dir dist/static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
